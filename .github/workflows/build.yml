name: Build Ruka Desktop Assistant

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore RukaDesktopAssistant.csproj
      - name: Build
        run: dotnet build RukaDesktopAssistant.csproj --configuration Release --no-restore
