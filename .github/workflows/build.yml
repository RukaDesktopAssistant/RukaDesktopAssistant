name: Build Ruka Desktop Assistant

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore RukaDesktopAssistant.csproj
      - name: Build
        run: dotnet build RukaDesktopAssistant.csproj --configuration Release --no-restore
      - name: Publish
        run: dotnet publish RukaDesktopAssistant.csproj --configuration Release --no-restore --self-contained false -o publish
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: RukaDesktopAssistant-build
          path: publish
