name: るか デスクトップアシスタント ビルド

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ruka-release
  cancel-in-progress: false

jobs:
  build:
    name: Windows版ビルド
    runs-on: windows-latest
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: .NET 8 を準備
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 依存関係を復元
        run: dotnet restore RukaDesktopAssistant.csproj

      - name: デスクトップ版をビルド
        run: dotnet build RukaDesktopAssistant.csproj --configuration Release --no-restore
      - name: るかAIサーバーを復元
        run: dotnet restore RukaAiServer/RukaAiServer.csproj
      - name: るかAIサーバーをビルド
        run: dotnet build RukaAiServer/RukaAiServer.csproj --configuration Release --no-restore

      - name: Windows用EXEを作成
        run: dotnet publish RukaDesktopAssistant.csproj --configuration Release --runtime win-x64 --self-contained true --output publish /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: EXE名を整える
        shell: pwsh
        run: Copy-Item publish\RukaDesktopAssistant.exe RukaDesktopAssistant.exe -Force

      - name: EXEを成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: RukaDesktopAssistant-EXE
          path: RukaDesktopAssistant.exe
          retention-days: 90

      - name: ポータブルZIPを作成
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath RukaDesktopAssistant-win-x64.zip -Force

      - name: ZIPを成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: RukaDesktopAssistant-win-x64
          path: RukaDesktopAssistant-win-x64.zip
          retention-days: 90

      - name: GitHub Releasesへ公開
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.3.0"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag RukaDesktopAssistant.exe RukaDesktopAssistant-win-x64.zip --repo $env:GITHUB_REPOSITORY --title "るか デスクトップアシスタント v0.3.0" --notes "Windows版るか デスクトップアシスタント v0.3.0。ドラッグ移動、表示、キャラクター動作を実機確認するための修正版です。"
          } else {
            gh release upload $tag RukaDesktopAssistant.exe RukaDesktopAssistant-win-x64.zip --repo $env:GITHUB_REPOSITORY --clobber
          }
